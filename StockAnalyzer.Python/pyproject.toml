[project]
name = "stockanalyzer-python"
version = "1.0.0"
description = "Python components for StockAnalyzer (market data fetching, technical calculation, RL training)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "yfinance==1.0",
    "pandas==2.3.3",
    "polars==1.39.0",
    "pyarrow==23.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "numpy>=1.26.0"
]
training = [
    "numpy>=1.26",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "tzdata>=2024.1",
    "gymnasium==1.4.0",
    "stable-baselines3==2.7.0",
    "torch>=2.2",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.7",
    "tensorflow>=2.16",
    "tf2onnx>=1.16",
    "lightgbm>=4.0",
    "scikit-learn>=1.1",
    "scipy>=1.3.2",
    "skl2onnx>=1.16",
    "onnxmltools>=1.12"
]
