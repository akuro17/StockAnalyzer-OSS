name: Publish Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        mode: [self-contained, framework-dependent]
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '8.0.x'

    - name: Configure appsettings.json
      run: |
        Copy-Item StockAnalyzer.Avalonia/appsettings.example.json StockAnalyzer.Avalonia/appsettings.json

    - name: Build and Publish (Self-contained)
      if: matrix.mode == 'self-contained'
      run: |
        dotnet publish StockAnalyzer.Avalonia/StockAnalyzer.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet publish StockAnalyzer.McpServer/StockAnalyzer.McpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build and Publish (Framework-dependent)
      if: matrix.mode == 'framework-dependent'
      run: |
        dotnet publish StockAnalyzer.Avalonia/StockAnalyzer.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet publish StockAnalyzer.McpServer/StockAnalyzer.McpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify MCP server in publish output
      run: |
        $mcpName = if ('${{ matrix.rid }}' -like 'win-*') { 'StockAnalyzer.McpServer.exe' } else { 'StockAnalyzer.McpServer' }
        if (-not (Test-Path (Join-Path ./publish $mcpName))) { Write-Error "$mcpName is missing from ./publish"; exit 1 }

    - name: Ensure Reference Manual in publish output
      run: |
        $dest = "./publish/docs/ReferenceManual"
        if (-not (Test-Path (Join-Path $dest "README.md"))) {
          $refManualSrc = if (Test-Path "docs/ReferenceManual") { "docs/ReferenceManual" } elseif (Test-Path "docs/OSS") { "docs/OSS" } else { $null }
          if ($refManualSrc) {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path "$refManualSrc/*" -Destination $dest -Recurse -Force
            Write-Host "Copied $refManualSrc to $dest"
          } else {
            Write-Error "Reference Manual source directory not found in repository."
            exit 1
          }
        }
        if (-not (Test-Path (Join-Path $dest "README.md"))) {
          Write-Error "ReferenceManual/README.md is missing from $dest"; exit 1
        }
        Write-Host "Verified docs/ReferenceManual in publish directory." -ForegroundColor Green

    - name: Ensure MCP Server Command Reference in publish output
      run: |
        $dest = "./publish/docs"
        if (-not (Test-Path (Join-Path $dest "MCP_SERVER_COMMAND_REFERENCE.md"))) {
          if (Test-Path "docs/MCP_SERVER_COMMAND_REFERENCE.md") {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path "docs/MCP_SERVER_COMMAND_REFERENCE.md" -Destination (Join-Path $dest "MCP_SERVER_COMMAND_REFERENCE.md") -Force
            Write-Host "Copied docs/MCP_SERVER_COMMAND_REFERENCE.md to $dest"
          } else {
            Write-Error "docs/MCP_SERVER_COMMAND_REFERENCE.md source file not found in repository."
            exit 1
          }
        }
        if (-not (Test-Path (Join-Path $dest "MCP_SERVER_COMMAND_REFERENCE.md"))) {
          Write-Error "MCP_SERVER_COMMAND_REFERENCE.md is missing from $dest"; exit 1
        }
        Write-Host "Verified docs/MCP_SERVER_COMMAND_REFERENCE.md in publish directory." -ForegroundColor Green

    - name: Ensure MCP Tool Documentation in publish output
      run: |
        $dest = "./publish/docs/MCP"
        if (-not (Test-Path (Join-Path $dest "README.md"))) {
          if (Test-Path "docs/MCP/README.md") {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path "docs/MCP/*" -Destination $dest -Recurse -Force
            Write-Host "Copied docs/MCP to $dest"
          } else {
            Write-Error "docs/MCP source directory not found in repository."
            exit 1
          }
        }
        if (-not (Test-Path (Join-Path $dest "README.md"))) {
          Write-Error "docs/MCP/README.md is missing from $dest"; exit 1
        }
        Write-Host "Verified docs/MCP in publish directory." -ForegroundColor Green

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./StockAnalyzer-${{ matrix.rid }}-${{ matrix.mode }}.zip

    - name: Upload temporary artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: asset-${{ matrix.rid }}-${{ matrix.mode }}
        path: ./StockAnalyzer-${{ matrix.rid }}-${{ matrix.mode }}.zip
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code for changelog
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Generate release notes
      shell: bash
      env:
        TAG_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
        PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" "${TAG_NAME}^" 2>/dev/null || echo "")

        # Method 2: Extract concise highlights from CHANGELOG.md
        CHANGELOG_NOTES=""
        if [ -n "${PREV_TAG}" ]; then
          CHANGELOG_NOTES=$(git diff -U0 "${PREV_TAG}..${TAG_NAME}" -- CHANGELOG.md \
            | grep -E '^\+[^+]' \
            | sed 's/^+//' \
            | grep -Ev '^(# Changelog|All notable changes|The format is based on|## \[Unreleased\]|---\s*$|$)' \
            | sed 's/^### /#### /' || true)
        elif [ -f CHANGELOG.md ]; then
          CHANGELOG_NOTES=$(awk '/^## \[/{if (found) exit; found=1; next} found && !/^---$/{print}' CHANGELOG.md \
            | sed 's/^### /#### /' || true)
        fi

        # Method 1: Extract structured commit details from OSS commit bodies, falling back to subjects
        COMMIT_DETAILS=""
        if [ -n "${PREV_TAG}" ]; then
          COMMIT_DETAILS=$(git log "${PREV_TAG}..${TAG_NAME}" --no-merges --pretty=format:"%b" \
            | awk 'NF{blank=0; print; next} !blank{blank=1; print}' || true)
          if [ -z "$(echo "${COMMIT_DETAILS}" | tr -d '[:space:]')" ]; then
            COMMIT_DETAILS=$(git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"- %s (%h)" --no-merges || true)
          fi
        else
          COMMIT_DETAILS=$(git log "${TAG_NAME}" -n 20 --no-merges --pretty=format:"%b" \
            | awk 'NF{blank=0; print; next} !blank{blank=1; print}' || true)
          if [ -z "$(echo "${COMMIT_DETAILS}" | tr -d '[:space:]')" ]; then
            COMMIT_DETAILS=$(git log "${TAG_NAME}" -n 20 --pretty=format:"- %s (%h)" --no-merges || true)
          fi
        fi

        {
          echo "Official release for StockAnalyzer OSS version ${TAG_NAME}."
          echo ""
          echo "## What's Changed"
          if [ -n "$(echo "${CHANGELOG_NOTES}" | tr -d '[:space:]')" ]; then
            echo ""
            echo "### Release Highlights"
            echo "${CHANGELOG_NOTES}"
          fi
          echo ""
          echo "### Commit Details"
          if [ -n "$(echo "${COMMIT_DETAILS}" | tr -d '[:space:]')" ]; then
            echo "${COMMIT_DETAILS}"
          elif [ -n "${PREV_TAG}" ]; then
            echo "- No commit differences found since ${PREV_TAG}."
          else
            echo "- Initial release."
          fi
          if [ -n "${PREV_TAG}" ]; then
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG_NAME}"
          fi
        } > "${NOTES_FILE}"

    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: asset-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ github.ref_name }}
        name: "StockAnalyzer OSS ${{ github.ref_name }}"
        body_path: ${{ runner.temp }}/release_notes.md
        draft: false
        prerelease: false
        files: |
          StockAnalyzer-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Move latest-dev tag to this release
      shell: bash
      env:
        TAG_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        git tag -f latest-dev "${TAG_NAME}^{commit}"
        git push -f origin refs/tags/latest-dev

        {
          echo "Rolling download link pointing to the latest build (**${TAG_NAME}**)."
          echo ""
          echo "See the [${TAG_NAME} release](https://github.com/${REPO}/releases/tag/${TAG_NAME}) for full release notes and changelog."
        } > "${RUNNER_TEMP}/latest_dev_notes.md"

    - name: Update latest-dev release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: latest-dev
        name: "StockAnalyzer OSS - Development Build (Latest)"
        body_path: ${{ runner.temp }}/latest_dev_notes.md
        draft: false
        prerelease: true
        files: |
          StockAnalyzer-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
