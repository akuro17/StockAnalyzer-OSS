name: Publish Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        mode: [self-contained, framework-dependent]
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '8.0.x'

    - name: Configure appsettings.json
      run: |
        Copy-Item StockAnalyzer.Avalonia/appsettings.example.json StockAnalyzer.Avalonia/appsettings.json

    - name: Build and Publish (Self-contained)
      if: matrix.mode == 'self-contained'
      run: |
        dotnet publish StockAnalyzer.Avalonia/StockAnalyzer.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet publish StockAnalyzer.McpServer/StockAnalyzer.McpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build and Publish (Framework-dependent)
      if: matrix.mode == 'framework-dependent'
      run: |
        dotnet publish StockAnalyzer.Avalonia/StockAnalyzer.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet publish StockAnalyzer.McpServer/StockAnalyzer.McpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify MCP server in publish output
      run: |
        $mcpName = if ('${{ matrix.rid }}' -like 'win-*') { 'StockAnalyzer.McpServer.exe' } else { 'StockAnalyzer.McpServer' }
        if (-not (Test-Path (Join-Path ./publish $mcpName))) { Write-Error "$mcpName is missing from ./publish"; exit 1 }

    - name: Ensure Reference Manual in publish output
      run: |
        $dest = "./publish/docs/ReferenceManual"
        if (-not (Test-Path (Join-Path $dest "README.md"))) {
          $refManualSrc = if (Test-Path "docs/ReferenceManual") { "docs/ReferenceManual" } elseif (Test-Path "docs/OSS") { "docs/OSS" } else { $null }
          if ($refManualSrc) {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path "$refManualSrc/*" -Destination $dest -Recurse -Force
            Write-Host "Copied $refManualSrc to $dest"
          } else {
            Write-Error "Reference Manual source directory not found in repository."
            exit 1
          }
        }
        if (-not (Test-Path (Join-Path $dest "README.md"))) {
          Write-Error "ReferenceManual/README.md is missing from $dest"; exit 1
        }
        Write-Host "Verified docs/ReferenceManual in publish directory." -ForegroundColor Green

    - name: Ensure MCP Server Command Reference in publish output
      run: |
        $dest = "./publish/docs"
        if (-not (Test-Path (Join-Path $dest "MCP_SERVER_COMMAND_REFERENCE.md"))) {
          if (Test-Path "docs/MCP_SERVER_COMMAND_REFERENCE.md") {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path "docs/MCP_SERVER_COMMAND_REFERENCE.md" -Destination (Join-Path $dest "MCP_SERVER_COMMAND_REFERENCE.md") -Force
            Write-Host "Copied docs/MCP_SERVER_COMMAND_REFERENCE.md to $dest"
          } else {
            Write-Error "docs/MCP_SERVER_COMMAND_REFERENCE.md source file not found in repository."
            exit 1
          }
        }
        if (-not (Test-Path (Join-Path $dest "MCP_SERVER_COMMAND_REFERENCE.md"))) {
          Write-Error "MCP_SERVER_COMMAND_REFERENCE.md is missing from $dest"; exit 1
        }
        Write-Host "Verified docs/MCP_SERVER_COMMAND_REFERENCE.md in publish directory." -ForegroundColor Green

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./StockAnalyzer-${{ matrix.rid }}-${{ matrix.mode }}.zip

    - name: Upload temporary artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: asset-${{ matrix.rid }}-${{ matrix.mode }}
        path: ./StockAnalyzer-${{ matrix.rid }}-${{ matrix.mode }}.zip
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: asset-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ github.ref_name }}
        name: "StockAnalyzer OSS ${{ github.ref_name }}"
        body: |
          Official release for StockAnalyzer OSS version ${{ github.ref_name }}.
          
          Please refer to the CHANGELOG.md for detailed release notes.
        draft: false
        prerelease: false
        files: |
          StockAnalyzer-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
