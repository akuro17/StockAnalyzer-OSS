name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC (09:00 JST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum pip version (security requirement) and Python series (3.13.17+ bundles pip 26.2.2); shared values
env:
  PIP_MIN_VERSION: '26.2.2'
  PYTHON_VERSION: '3.13'

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality
        build-mode: ${{ matrix.build-mode }}

    # C# Build Pipeline
    - name: Setup .NET SDK
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      if: matrix.language == 'csharp'
      run: dotnet restore StockAnalyzer.sln

    - name: Build C# Project
      if: matrix.language == 'csharp'
      run: dotnet build StockAnalyzer.sln --configuration Release --no-restore --no-incremental

    # Python Pipeline
    - name: Setup Python
      if: matrix.language == 'python'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '${{ env.PYTHON_VERSION }}'
        cache: 'pip'
        cache-dependency-path: 'StockAnalyzer.Python/requirements.txt'

    - name: Install Python dependencies
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade "pip>=${{ env.PIP_MIN_VERSION }}" certifi
        if [ -f StockAnalyzer.Python/requirements.txt ]; then
          pip install -r StockAnalyzer.Python/requirements.txt
        else
          echo "::warning::No dependency file found; CodeQL will run without installed dependencies."
        fi
      shell: bash

    # Perform analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{ matrix.language }}"
        threads: 4
