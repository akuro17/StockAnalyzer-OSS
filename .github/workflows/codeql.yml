name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC (09:00 JST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.37.3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality
        build-mode: ${{ matrix.build-mode }}

    # C# Build Pipeline
    - name: Setup .NET SDK
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      if: matrix.language == 'csharp'
      run: dotnet restore StockAnalyzer.sln

    - name: Build C# Project
      if: matrix.language == 'csharp'
      run: dotnet build StockAnalyzer.sln --configuration Release --no-restore --no-incremental

    # Python Pipeline
    - name: Setup Python
      if: matrix.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'StockAnalyzer.Python/requirements.txt'

    - name: Install Python dependencies
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade pip
        if [ -f StockAnalyzer.Python/requirements.txt ]; then
          pip install -r StockAnalyzer.Python/requirements.txt
        else
          echo "::warning::No dependency file found; CodeQL will run without installed dependencies."
        fi
      shell: bash

    # Perform analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.37.3
      with:
        category: "/language:${{ matrix.language }}"
        threads: 4
