name: Publish Development Release

# Manual only: the private repository has no GitHub Actions minutes (billing; the owner does not pay), so push and pull request triggers
# would only fail. Release builds run in the public StockAnalyzer-OSS repository.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        mode: [self-contained, framework-dependent]
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x'

    - name: Configure appsettings.json
      run: |
        Copy-Item StockAnalyzer.Avalonia/appsettings.example.json StockAnalyzer.Avalonia/appsettings.json

    - name: Build and Publish (Self-contained)
      if: matrix.mode == 'self-contained'
      run: |
        dotnet publish StockAnalyzer.Avalonia/StockAnalyzer.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet publish StockAnalyzer.McpServer/StockAnalyzer.McpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build and Publish (Framework-dependent)
      if: matrix.mode == 'framework-dependent'
      run: |
        dotnet publish StockAnalyzer.Avalonia/StockAnalyzer.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet publish StockAnalyzer.McpServer/StockAnalyzer.McpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify MCP server in publish output
      run: |
        $mcpName = if ('${{ matrix.rid }}' -like 'win-*') { 'StockAnalyzer.McpServer.exe' } else { 'StockAnalyzer.McpServer' }
        if (-not (Test-Path (Join-Path ./publish $mcpName))) { Write-Error "$mcpName is missing from ./publish"; exit 1 }

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./StockAnalyzer-${{ matrix.rid }}-${{ matrix.mode }}.zip

    - name: Upload temporary artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: asset-${{ matrix.rid }}-${{ matrix.mode }}
        path: ./StockAnalyzer-${{ matrix.rid }}-${{ matrix.mode }}.zip
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code (for tag move)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Move latest-dev tag to this commit
      shell: bash
      run: |
        git tag -f latest-dev "${{ github.sha }}"
        git push -f origin refs/tags/latest-dev

    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: asset-*
        merge-multiple: true

    - name: Create or Update Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: latest-dev
        name: "StockAnalyzer OSS - Development Build (Latest)"
        body: |
          This is a rolling development build automatically compiled from the latest commit on the `main` branch.
          
          Commit: ${{ github.sha }}
          Built on: ${{ github.event.head_commit.timestamp || 'N/A' }}
        draft: false
        prerelease: true
        files: |
          StockAnalyzer-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
