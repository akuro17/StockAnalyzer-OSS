name: Cross-Platform CI

# Manual only: the private repository has no GitHub Actions minutes (billing; the owner does not pay), so push and pull request triggers
# would only fail. Release builds run in the public StockAnalyzer-OSS repository.
on:
  workflow_dispatch:

permissions:
  contents: read

# Minimum pip version (security requirement) and Python series (3.13.17+ bundles pip 26.2.2); shared values
env:
  PIP_MIN_VERSION: '26.2.2'
  PYTHON_VERSION: '3.13'

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Cold Restore Dependencies
        run: dotnet restore StockAnalyzer.sln --force

      - name: Clean Release Build
        run: dotnet build StockAnalyzer.sln -c Release --no-incremental

      - name: Run Cross-Platform Core Tests
        run: dotnet test Tests/StockAnalyzer.Core.Tests/StockAnalyzer.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Cross-Platform Avalonia Unit Tests
        run: dotnet test Tests/StockAnalyzer.Avalonia.Tests/StockAnalyzer.Avalonia.Tests.csproj -c Release --no-build --verbosity normal --filter "Category!=E2E&FullyQualifiedName!~UITests"

  python-audit:
    name: Python Dependencies & Portability (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade "pip>=${{ env.PIP_MIN_VERSION }}" certifi
          pip install -r StockAnalyzer.Python/requirements.txt
          pip check
